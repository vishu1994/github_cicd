name: Python CI

on:
  pull_request:

env:
  APP_ENV: dev

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Show Environment
        run: echo "APP ENV ${APP_ENV}"

      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest