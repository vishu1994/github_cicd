name: Python CI

on:
  pull_request:

env:
  APP_ENV: dev
  DUMMY_SECRET: ${{secrets.DUMMY_SECRET}}

jobs:
  run-linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .


  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Show Environment
        run: echo "APP ENV ${APP_ENV}"
      
      - name: Show Dummy Secret
        run: |
          if [ -n "$DUMMY_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest
  

  build-job:
    needs: [run-linting, run-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t cicd-demo .